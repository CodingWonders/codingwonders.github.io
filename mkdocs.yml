site_name: CodingWonders Software
site_url: https://codingwonders.github.io

theme:
  name: material
  custom_dir: overrides
  sticky_navigation: False
  prev_next_buttons_location: none
  logo: logo.png
  favicon: img/favicon.ico
  font:
    text: Segoe UI
  features:
    - search.suggest
  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: blue
      scheme: default
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: blue
      scheme: slate
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference


plugins:
  - search
  - blog
  - rss:
      abstract_chars_count: -1
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
        as_update: ""
      categories:
        - categories
        - tags
      feeds_filenames:
        rss_created: feed.xml
        rss_updated: feed_updated.xml
        json_created: feed.json
        json_updated: feed_updated.json
      rss_feed_enabled: true
      json_feed_enabled: true
      length: 2147483647

nav:
  - Home: index.md
  - Blog: blog/index.md
  - Software:
      - DISMTools: https://codingwonders.github.io/DISMTools
      - MicroWin: https://codingwonders.github.io/MicroWin
      - UnattendGen: https://codingwonders.github.io/UnattendGen
  - Contact:
      - Email: mailto:betareporter98@gmail.com
      - CWS Community Discord server: https://discord.gg/5TxEmKXNwu
  - About Me: about.md